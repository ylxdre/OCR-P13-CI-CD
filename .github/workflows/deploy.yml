name: deploy

on:
  push:
    branches: ['github-actions']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  deploy:
    needs: push
    name: Deploy on VPS
    runs-on: ubuntu-latest

    steps:
      - name: setup ssh key
        run: |
          install -m 600 -D /dev/null ~/.ssh/ocr-p13-github
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ocr-p13-github
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: connect and pull
        run: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && docker compose pull && docker compose up -d && exit"

      - name: cleanup
        run: rm -rf ~/.ssh 
